name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Go Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Download and verify dependencies
        run: |
          go mod tidy
          go mod download
          go mod verify

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install staticcheck and gosec
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run gosec security audit
        run: gosec -quiet ./...

  build:
    name: Build Binary & Container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Download and verify dependencies
        run: |
          go mod tidy
          go mod download
          go mod verify

      - name: Build collector binary
        run: go build -v -o collector ./cmd/collector

      - name: Docker build test
        run: docker build -t finops-collector:test .

  lint-dashboards:
    name: Validate Grafana Dashboard JSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate JSON syntax
        shell: bash
        run: |
          shopt -s nullglob
          files=(dashboard/grafana/dashboards/*.json)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No dashboard JSON files found — skipping."
            exit 0
          fi

          for f in "${files[@]}"; do
            echo "Validating $f..."
            python3 -m json.tool "$f" > /dev/null
          done

          echo "All Grafana dashboard JSON files are valid."
