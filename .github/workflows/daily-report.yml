name: Daily FinOps Report

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  issues: write

env:
  # Portfolio project — no real secrets are configured.
  # These vars allow graceful skipping of AWS/Slack steps.
  HAS_AWS_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}
  HAS_SLACK: ${{ secrets.SLACK_WEBHOOK_URL != '' }}

jobs:
  collect-and-report:
    name: Run Collector & Generate Daily Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        if: env.HAS_AWS_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Download and verify dependencies
        working-directory: collector
        run: |
          go mod tidy
          go mod download
          go mod verify

      - name: Build collector binary
        working-directory: collector
        run: go build -o collector ./cmd/collector

      - name: Ensure reports directory exists
        run: mkdir -p reports

      - name: Run FinOps collector
        if: env.HAS_AWS_ROLE == 'true'
        run: |
          ./collector/collector \
            --output-format all \
            --output-dir reports/ \
            --days 14

      - name: Generate placeholder report (no AWS credentials)
        if: env.HAS_AWS_ROLE != 'true'
        shell: bash
        run: |
          DATE=$(date +%F)
          cat > "reports/report-${DATE}.json" <<EOF
          {
            "generated_at": "${DATE}T06:00:00Z",
            "account_id": "123456789012",
            "total_monthly_waste": 0.00,
            "waste_percentage": 0.0,
            "findings": [],
            "note": "Placeholder report — no AWS credentials configured"
          }
          EOF

          cat > "reports/report-${DATE}.md" <<EOF
          # FinOps Daily Report — ${DATE}

          > **Note:** This is a placeholder report. No AWS credentials are configured.

          | Metric              | Value   |
          |---------------------|---------|
          | Total Monthly Waste | \$0.00  |
          | Waste Percentage    | 0.0%    |
          | Findings            | 0       |

          *Generated by AWS FinOps Dashboard (portfolio demo)*
          EOF

          echo "Placeholder report generated for ${DATE}"

      - name: Commit reports to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/

          if git diff --staged --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "chore(report): daily finops report $(date +%F) [skip ci]"
          git push

      - name: Upload JSON report artifact
        uses: actions/upload-artifact@v4
        with:
          name: finops-report-json
          path: reports/report-*.json
          if-no-files-found: warn

      - name: Post summary to Slack
        if: env.HAS_SLACK == 'true'
        shell: bash
        run: |
          LATEST_MD=$(ls -t reports/report-*.md 2>/dev/null | head -n 1)

          if [ -z "$LATEST_MD" ]; then
            echo "No markdown report found — skipping Slack."
            exit 0
          fi

          SUMMARY=$(head -n 25 "$LATEST_MD")

          jq -n --arg text "📊 *AWS FinOps Daily Report Summary*\n\`\`\`\n${SUMMARY}\n\`\`\`" \
            '{text: $text}' |
          curl -fsSL -X POST \
            -H 'Content-type: application/json' \
            --data @- \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Auto-create GitHub issue for critical waste findings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const reportsDir = 'reports';
            if (!fs.existsSync(reportsDir)) {
              core.info('No reports directory found.');
              return;
            }

            const files = fs.readdirSync(reportsDir)
              .filter(name => /^report-.*\.json$/.test(name))
              .sort();

            if (files.length === 0) {
              core.info('No report JSON files found.');
              return;
            }

            const latestFile = path.join(reportsDir, files[files.length - 1]);
            const report = JSON.parse(fs.readFileSync(latestFile, 'utf8'));

            const totalWaste = Number(report.total_monthly_waste || 0);
            const wastePercentage = Number(report.waste_percentage || 0);
            const findings = Array.isArray(report.findings) ? report.findings : [];

            if (totalWaste <= 500) {
              core.info(`Monthly waste $${totalWaste.toFixed(2)} is below $500 threshold.`);
              return;
            }

            const issueTitle = `🚨 Critical AWS Cost Waste Detected: $${totalWaste.toFixed(2)}/month`;

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'finops,cost-waste',
              per_page: 100
            });

            if (existingIssues.data.some(issue => issue.title === issueTitle)) {
              core.info('A matching open issue already exists — skipping.');
              return;
            }

            const lines = [
              '## ⚠️ High Cost Waste Alert',
              '',
              `- **Account:** \`${report.account_id || 'unknown'}\``,
              `- **Identified Waste:** $${totalWaste.toFixed(2)}/month`,
              `- **Waste Percentage:** ${wastePercentage.toFixed(1)}%`,
              '',
              '### Top Critical Findings:'
            ];

            const critical = findings
              .filter(f => f.severity === 'critical')
              .slice(0, 5);

            if (critical.length === 0) {
              lines.push('- No critical findings in the latest report.');
            } else {
              for (const f of critical) {
                const name = f.resource_name || 'unknown';
                const type = f.resource_type || 'unknown';
                const cost = Number(f.monthly_waste_cost || 0);
                const rec  = f.recommendation || 'N/A';
                lines.push(`- **${name}** (\`${type}\`): $${cost.toFixed(2)}/mo — ${rec}`);
              }
            }

            lines.push('');
            lines.push('*Automated issue created by AWS FinOps Daily Report workflow.*');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: lines.join('\n'),
              labels: ['finops', 'cost-waste']
            });

            core.info(`Created issue: ${issueTitle}`);
